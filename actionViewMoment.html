<!-- This page is what the user will see after action Add Moment is saved  -->
<body>
    <main class="main-add-moment-container">

        <div>
            <h1>My [moment_title] moment.</h1>


        </div>
        
        <!-- once we learn javascript replace image upload with a  -->
        <div>
            <!-- <h2> Drag and drop your image</h2> -->
            <div class="drop-area">
                
            </div>

            <form class="moment-form">
                <div>
                    <label for="moment_title"> Moment Title:</label>
                    <input type="text" name="moment_title" id="moment_title">
                </div>

                <div>
                    <label for="moment_description"> Description:</label>
                    <textarea type="textarea" name="moment_description" id="moment_description"></textarea>
                </div>  

                <div>
                    <label for="moment_status"> Status:</label>
                    <select name="moment_status"
                    id="moment_status">
                       <option value="" disabled selected>Select</option>
                        <option value="complete"">Complete</option>
                        <option value="in_progress">In Progress</option>
                    </select>
                </div> 
                
                <div>
                    <label for="moment_feelings"> Feelings:</label>
                    <input type="text" name="moment_feelings" id="moment_feelings"></input>
                </div>  

                <div>
                    <label for="moment_milestones"> Milestone:</label>
                    <input type="text" name="moment_milestones" id="moment_milestones"></input>
                </div>  

                <div>
                    <label for="moment_date"> Date of moment:</label>
                    <input type="date" name="moment_milestones" id="moment_milestones"></input>
                </div>  

                <div class="main-action-form-div-submit-container"><input class="main-action-form-div-input" type="submit" value="Save">
                </div>
                
            </form>
        </div>
        <!--  -->
